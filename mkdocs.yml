site_name: The Leo blog
site_description: A blog about MRI, AI, PCB design, and embedded systems.
site_author: Leo
# Required for instant navigation, search, and canonical URLs. Replace with your real site URL when you deploy (e.g. GitHub Pages).
site_url: https://example.com

theme:
  name: material
  palette:
    # Light mode (default)
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - toc.follow
    - navigation.tracking

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
    - Categories:
        - MRI: blog/category/mri.md
        - AI Agents: blog/category/ai-agents.md
        - PCB design: blog/category/pcb-design.md
        - Embedded systems: blog/category/embedded-systems.md

plugins:
  - blog:
      archive: true
      categories_allowed:
        - MRI
        - AI Agents
        - PCB design
        - Embedded systems

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
